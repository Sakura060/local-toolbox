<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>文件户口本 — 每个文件都有身世</title>
<style>
  :root{--bg:#12161a;--panel:#1a2027;--line:#28313b;--text:#e3eaef;--dim:#8a97a3;
    --blue:#4da3ff;--green:#7ee0a3;--amber:#ffce6b;--red:#ff8f8f}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);
    font-family:"Microsoft YaHei UI",system-ui,sans-serif}
  header{background:var(--panel);border-bottom:1px solid var(--line);
    padding:12px 16px;position:sticky;top:0}
  .row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .logo{font-size:19px;font-weight:700}
  .logo b{color:var(--amber)}
  #q{flex:1;min-width:260px;padding:10px 14px;font-size:14px;border-radius:10px;
    border:1px solid var(--line);background:var(--bg);color:var(--text);outline:none}
  #q:focus{border-color:var(--amber)}
  button{padding:9px 14px;border-radius:10px;border:1px solid var(--line);
    background:var(--bg);color:var(--text);cursor:pointer;font-size:13px}
  button:hover{border-color:var(--amber);color:var(--amber)}
  main{max-width:900px;margin:0 auto;padding:18px 16px}
  #hint{color:var(--dim);font-size:12px;margin-bottom:14px;line-height:1.7}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:12px 14px;margin-bottom:12px}
  .name{font-weight:600;font-size:14px;word-break:break-all}
  .path{color:var(--dim);font-size:12px;word-break:break-all;margin-top:2px}
  .badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11px;
    margin-right:6px;vertical-align:1px}
  .b-net{background:#12283f;color:var(--blue)}
  .b-chat{background:#15301f;color:var(--green)}
  .b-unknown{background:#332a12;color:var(--amber)}
  .b-gone{background:#331b1b;color:var(--red)}
  .detail{font-size:12px;color:var(--dim);margin-top:5px;word-break:break-all}
  .timeline{margin-top:8px;border-top:1px dashed var(--line);padding-top:7px}
  .timeline div{font-size:12px;color:var(--dim);padding:1.5px 0}
  .timeline b{color:var(--text);font-weight:500}
  #empty{color:var(--dim);text-align:center;padding:50px 0;line-height:2}
  #toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);
    background:#2a1215;color:#ffb4ae;border:1px solid #5c2a2c;padding:8px 16px;
    border-radius:10px;font-size:13px;display:none}
</style>
</head>
<body>
<header>
  <div class="row">
    <div class="logo">文件户口<b>本</b></div>
    <input id="q" type="search" placeholder="输入文件路径或文件名关键词，比如：setup.exe / 报销单 / C:\Users\...\Downloads\xxx.zip">
    <button id="scan">盘点下载夹</button>
  </div>
</header>
<main>
  <p id="hint">来源标记：★ 实证（文件自带来源证书）　☆ 浏览器下载记录　？ 目录推测。<br>
  事件时间线从“记账”启动后开始积累（cli.py watch，需管理员）；<br>
  谱系链（改名/移动历史）需要先做全量快照并回溯日志：cli.py deep --history（需管理员）。</p>
  <div id="list"></div>
  <div id="empty"></div>
</main>
<div id="toast"></div>

<script>
const $ = s => document.querySelector(s);
const TYPE_LABEL = {"网络下载":"net","微信接收":"chat","QQ接收":"chat","钉钉接收":"chat",
  "应用保存":"net","外部来源":"unknown","浏览器下载":"unknown"};
const CONF = {ads:"★ 实证", browser:"☆ 下载记录", dir:"？ 推测"};

function esc(s){const d=document.createElement("div");d.textContent=s==null?"":String(s);return d.innerHTML;}
function fmt(ts){if(!ts)return "—";const d=new Date(ts*1000);const p=x=>String(x).padStart(2,"0");
  return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`;}
function toast(m){const t=$("#toast");t.textContent=m;t.style.display="block";
  clearTimeout(t._h);t._h=setTimeout(()=>t.style.display="none",2600);}

function badge(r){
  const cls = TYPE_LABEL[r.src_type] || "unknown";
  let extra = r.exists ? "" : ` <span class="badge b-gone">文件已不在</span>`;
  return `<span class="badge b-${cls}">${esc(r.src_type)}</span>${extra}
    <span style="color:var(--dim);font-size:11px">${CONF[r.confidence]||r.confidence} · ${fmt(r.first_seen)}</span>`;
}

function card(r){
  const d = document.createElement("div");
  d.className = "card";
  const tl = (r.events||[]).map(e =>
    `<div>${e.ts_str}　<b>${esc((e.reason_names||[]).join("/")||"事件")}</b></div>`).join("");
  d.innerHTML = `
    <div class="name">${esc(r.name)}</div>
    <div class="path">${esc(r.path)}</div>
    <div style="margin-top:6px">${badge(r)}</div>
    ${r.detail?`<div class="detail">${esc(r.detail)}</div>`:""}
    ${tl?`<div class="timeline">${tl}</div>`:""}`;
  return d;
}

function lineageCard(j){
  const d = document.createElement("div");
  d.className = "card";
  const steps = (j.chain||[]).map(c =>
    `<div>${esc(c.ts_str || fmt(c.ts))}　<b>${esc(c.action)}</b> → ${esc(c.name)}</div>`).join("");
  d.innerHTML = `<div class="name">谱系链 <span style="color:var(--dim);font-weight:400">（卷 ${esc(j.vol)} · frn ${j.frn}）</span></div>
    <div class="timeline">${steps || "<div>日志范围内无改名/移动记录</div>"}</div>`;
  return d;
}

async function attachLineage(exactPath){
  try{
    const r = await fetch("/api/lineage?q=" + encodeURIComponent(exactPath));
    const j = await r.json();
    if(j && j.ok) $("#list").prepend(lineageCard(j));
  }catch(e){ /* 谱系是增强信息，失败不打扰主列表 */ }
}

async function lookup(){
  const q = $("#q").value.trim();
  const url = "/api/lookup" + (q ? `?q=${encodeURIComponent(q)}` : "");
  const r = await fetch(url); const data = await r.json();
  const list = $("#list"); list.innerHTML = "";
  $("#empty").style.display = "none";
  if(!data.items.length){
    $("#empty").style.display = "block";
    $("#empty").textContent = q ? "没有命中。点右上角“盘点下载夹”先建库。" : "库是空的。点右上角“盘点下载夹”。";
    return;
  }
  for(const it of data.items) list.appendChild(card(it));
  if(data.exact) attachLineage(data.exact);
}

$("#q").addEventListener("keydown", e => { if(e.key === "Enter") lookup(); });
$("#q").addEventListener("search", () => lookup());   // type=search 的原生回车事件
$("#q").addEventListener("input", () => { if(!$("#q").value.trim()) lookup(); });

$("#scan").onclick = async () => {
  toast("正在盘点下载夹（含浏览器记录）…");
  try{
    const r = await fetch("/api/scan",{method:"POST",body:JSON.stringify({})});
    const j = await r.json();
    if(j.ok){ toast(`完成：归因 ${j.summary.attributed} / ${j.summary.files} 个文件`); lookup(); }
    else toast(j.error || "扫描失败");
  }catch(e){ toast("请求失败："+e); }
};

lookup();
</script>
</body>
</html>
