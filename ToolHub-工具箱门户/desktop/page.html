<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧰</text></svg>">
<title>ToolHub 工具箱</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f4f6f9; --bg2: #ecf0f5; --card: #ffffff; --text: #1f2937; --muted: #6b7280; --faint: #9aa3af;
    --border: #e5e7eb; --line: #eef0f3; --accent: #2563eb; --accent-soft: #eff6ff; --accent-text: #1d4ed8;
    --ok: #16a34a; --warn: #b45309; --warn-bg: #fffbeb; --warn-border: #fde68a;
    --bad: #dc2626; --bad-bg: #fef2f2; --bad-border: #fecaca;
    --mark: #fef08a; --code-bg: #f3f4f6;
    --shadow-sm: 0 1px 3px rgba(17,24,39,.07);
    --shadow-lg: 0 12px 32px rgba(17,24,39,.16);
    --radius: 14px; --radius-sm: 9px; --space: 16px;
    --sidebar-w: 236px; --topbar-h: 58px;
    --font: 15px/1.6 system-ui, "Segoe UI", "Microsoft YaHei", sans-serif;
  }
  html.dark {
    color-scheme: dark;
    --bg: #0f172a; --bg2: #0b1222; --card: #1e293b; --text: #e2e8f0; --muted: #94a3b8; --faint: #64748b;
    --border: #334155; --line: #26324a; --accent: #60a5fa; --accent-soft: #1e3a8a; --accent-text: #93c5fd;
    --ok: #4ade80; --warn: #fbbf24; --warn-bg: #3b2708; --warn-border: #92610c;
    --bad: #f87171; --bad-bg: #3b0d0d; --bad-border: #7f1d1d;
    --mark: #854d0e; --code-bg: #0b1222;
    --shadow-sm: 0 1px 3px rgba(0,0,0,.4);
    --shadow-lg: 0 12px 32px rgba(0,0,0,.55);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text); font: var(--font);
    -webkit-font-smoothing: antialiased;
    display: grid; grid-template-columns: var(--sidebar-w) 1fr;
    min-height: 100vh;
  }
  button { font: inherit; }
  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .hidden { display: none !important; }

  /* ---------- 侧边栏 ---------- */
  #side {
    background: var(--bg2); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; padding: 14px 10px 10px;
    position: sticky; top: 0; height: 100vh; overflow-y: auto;
  }
  .brand { display: flex; align-items: center; gap: 8px; font-size: 17px; font-weight: 700; padding: 4px 10px 12px; }
  .brand small { display: block; font-size: 11.5px; font-weight: 400; color: var(--muted); letter-spacing: .3px; }
  .navsec { color: var(--faint); font-size: 11.5px; padding: 12px 12px 4px; letter-spacing: .5px; }
  .nav {
    display: flex; align-items: center; gap: 9px; width: 100%;
    padding: 7px 12px; border: 0; border-radius: 10px; background: none;
    color: var(--text); cursor: pointer; text-align: left; font-size: 14px;
    transition: background .12s;
  }
  .nav:hover { background: var(--line); }
  .nav.active { background: var(--accent-soft); color: var(--accent-text); font-weight: 600; }
  .nav .cnt { margin-left: auto; color: var(--faint); font-size: 12px; }
  .nav .em { width: 20px; text-align: center; flex: none; }
  #sidefoot { margin-top: auto; padding: 10px 12px 2px; color: var(--faint); font-size: 11.5px; }
  #sidefoot b { color: var(--ok); }

  /* ---------- 主区 ---------- */
  #main { min-width: 0; display: flex; flex-direction: column; }
  #topbar {
    position: sticky; top: 0; z-index: 30;
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
    padding: 10px 22px; background: color-mix(in srgb, var(--bg) 86%, transparent);
    backdrop-filter: blur(8px); border-bottom: 1px solid var(--border);
    min-height: var(--topbar-h);
  }
  #burger { display: none; }
  .searchwrap { position: relative; flex: 1 1 260px; max-width: 620px; }
  #q {
    width: 100%; padding: 9px 38px 9px 36px; font-size: 14.5px;
    border: 1px solid var(--border); border-radius: 12px; outline: none;
    background: var(--card); color: var(--text); box-shadow: var(--shadow-sm);
    transition: border-color .15s, box-shadow .15s;
  }
  #q:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(37,99,235,.14); }
  .sicon { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); opacity: .55; pointer-events: none; font-size: 14px; }
  #qclear {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    width: 22px; height: 22px; border-radius: 50%; border: 0; cursor: pointer;
    background: var(--border); color: var(--muted); font-size: 13px; line-height: 1;
  }
  .tbtn {
    padding: 6px 13px; border-radius: 10px; font-size: 13px; cursor: pointer;
    border: 1px solid var(--border); background: var(--card); color: var(--text);
    transition: transform .1s;
  }
  .tbtn:active { transform: scale(.95); }
  #netstat { color: var(--muted); font-size: 12.5px; margin-left: auto; white-space: nowrap; }
  #netstat b { color: var(--ok); }

  #view { padding: 18px 22px 46px; max-width: 1180px; width: 100%; margin: 0 auto; }

  /* ---------- 分类与卡片 ---------- */
  .cathead { display: flex; align-items: baseline; gap: 10px; margin: 20px 2px 10px; }
  .cathead:first-child { margin-top: 4px; }
  .cathead h2 { margin: 0; font-size: 16.5px; }
  .cathead .n { color: var(--faint); font-size: 12.5px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(292px, 1fr)); gap: 14px; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px 15px; display: flex; flex-direction: column; gap: 7px;
    box-shadow: var(--shadow-sm); transition: transform .15s ease, box-shadow .15s ease;
    position: relative;
  }
  .card:hover { transform: translateY(-2px); box-shadow: var(--shadow-lg); }
  .card.dragging { opacity: .45; }
  .card .row { display: flex; align-items: center; gap: 9px; }
  .ticon { font-size: 21px; line-height: 1; flex: none; }
  .card h3 { margin: 0; font-size: 15px; flex: 1; min-width: 0; }
  .card h3 a { color: inherit; text-decoration: none; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--faint); flex: none; }
  .dot.on { background: var(--ok); animation: pulse 2.2s infinite; }
  @keyframes pulse {
    0% { box-shadow: 0 0 0 0 rgba(22,163,74,.35); }
    70% { box-shadow: 0 0 0 7px rgba(22,163,74,0); }
    100% { box-shadow: 0 0 0 0 rgba(22,163,74,0); }
  }
  .ms { color: var(--faint); font-size: 11.5px; flex: none; }
  .ticon-img { width: 22px; height: 22px; border-radius: 5px; flex: none; object-fit: contain; }
  .dot.bad { background: var(--bad); }
  .dot.warn2 { background: var(--warn); }
  .dhead .ticon-img { width: 44px; height: 44px; border-radius: 10px; }
  .plugrow { display: flex; align-items: center; gap: 11px; padding: 10px 4px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .plugrow:last-child { border-bottom: 0; }
  .plugrow .pico { width: 30px; height: 30px; border-radius: 7px; object-fit: contain; flex: none; }
  .plugrow .pmain { flex: 1; min-width: 180px; }
  .plugrow .pname { font-weight: 600; font-size: 14px; }
  .plugrow .pmeta { color: var(--muted); font-size: 12px; display: flex; gap: 8px; flex-wrap: wrap; margin-top: 1px; }
  .plugrow .pacts { display: flex; gap: 6px; flex-wrap: wrap; }
  .statetag { font-size: 11.5px; padding: 1px 9px; border-radius: 999px; border: 1px solid var(--border); }
  .statetag.ok { color: var(--ok); border-color: var(--ok); }
  .statetag.invalid { color: var(--bad); border-color: var(--bad); background: var(--bad-bg); }
  .statetag.disabled { color: var(--faint); }
  .statetag.draft { color: var(--warn); border-color: var(--warn-border); background: var(--warn-bg); }
  /* 向导 */
  .steps { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
  .steps .st { font-size: 12px; padding: 3px 11px; border-radius: 999px; border: 1px solid var(--border); color: var(--faint); }
  .steps .st.on { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
  .steps .st.done { color: var(--accent-text); border-color: var(--accent); }
  .wcard { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px 20px; box-shadow: var(--shadow-sm); }
  .wcard h3 { margin: 0 0 6px; font-size: 17px; }
  .wcard .hint2 { color: var(--muted); font-size: 13px; margin-bottom: 14px; }
  .dropzone { border: 2px dashed var(--border); border-radius: var(--radius); padding: 34px 20px; text-align: center; color: var(--muted); font-size: 14px; }
  .wrow { display: flex; gap: 10px; align-items: flex-start; margin: 10px 0; flex-wrap: wrap; }
  .wrow label { min-width: 96px; color: var(--muted); font-size: 13px; padding-top: 8px; flex: none; }
  .wrow input[type=text], .wrow textarea, .wrow select {
    flex: 1; min-width: 220px; padding: 8px 10px; font-size: 13.5px;
    border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text); outline: none;
    font-family: inherit;
  }
  .wrow textarea { min-height: 56px; font: 12.5px/1.5 Consolas, monospace; }
  .wrow input:focus, .wrow textarea:focus { border-color: var(--accent); }
  .preview-card { background: var(--code-bg); border: 1px solid var(--border); border-radius: 9px; padding: 12px 14px; font-size: 13px; margin: 10px 0; }
  .preview-card .kv2 { margin: 3px 0; word-break: break-all; }
  .preview-card .kv2 b { color: var(--muted); margin-right: 6px; font-weight: 600; }
  .wfoot { display: flex; gap: 8px; margin-top: 18px; flex-wrap: wrap; align-items: center; }
  .wfoot .spacer { flex: 1; }
  .checkline { display: flex; gap: 8px; align-items: flex-start; font-size: 13.5px; margin: 10px 0; }
  .checkline input { margin-top: 3px; }

  .card p { margin: 0; color: var(--muted); font-size: 12.8px; flex: 1; }
  .tagrow { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .tag {
    font-size: 11.5px; padding: 1px 9px; border-radius: 999px;
    border: 1px solid var(--border); color: var(--muted);
  }
  .tag.warn { color: var(--warn); background: var(--warn-bg); border-color: var(--warn-border); }
  .tag.exp  { color: var(--accent-text); background: var(--accent-soft); border-color: var(--accent); }
  .star {
    position: absolute; top: 9px; right: 11px; border: 0; background: none;
    font-size: 15px; cursor: pointer; color: var(--faint); opacity: .55; padding: 2px;
  }
  .star:hover { opacity: 1; }
  .star.on { opacity: 1; color: #f59e0b; }
  .card .acts { display: flex; gap: 7px; align-items: center; margin-top: 2px; }
  .btn {
    display: inline-block; padding: 4.5px 13px; border-radius: 8px; font-size: 12.8px;
    border: 1px solid var(--border); background: var(--card); color: var(--text);
    cursor: pointer; text-decoration: none; transition: transform .1s, opacity .12s;
  }
  .btn:active { transform: scale(.96); }
  .btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
  .btn.danger { color: var(--bad); border-color: var(--bad-border); }
  .btn.open { background: var(--accent-soft); border-color: var(--accent); color: var(--accent-text); font-weight: 600; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .empty { color: var(--muted); text-align: center; padding: 26px; font-size: 13.5px;
    border: 1px dashed var(--border); border-radius: var(--radius); }

  /* ---------- 搜索结果 ---------- */
  #results { margin-top: 4px; }
  .rgroup { background: var(--card); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 12px; overflow: hidden; box-shadow: var(--shadow-sm); }
  .rgroup .ghead { display: flex; align-items: center; gap: 10px; padding: 9px 15px; background: var(--line); border-bottom: 1px solid var(--border); font-size: 13px; }
  .ghead .cnt { color: var(--muted); }
  .ghead .err { color: var(--warn); }
  .ritem { display: flex; gap: 12px; padding: 9px 15px; border-bottom: 1px solid var(--line); }
  .ritem:last-child { border-bottom: 0; }
  .rthumb { width: 84px; height: 60px; object-fit: cover; border-radius: 6px; border: 1px solid var(--border); background: var(--code-bg); flex: none; }
  .rmain { min-width: 0; flex: 1; }
  .rtitle { font-weight: 600; font-size: 13.8px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .rsnip { color: var(--muted); font-size: 12.8px; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .rmeta { color: var(--faint); font-size: 11.8px; margin-top: 2px; display: flex; gap: 10px; flex-wrap: wrap; }
  .ritem.link { cursor: pointer; }
  .ritem.link:hover { background: var(--line); }
  .qtools { display: flex; gap: 8px; flex-wrap: wrap; margin: 10px 0 14px; }
  .skel { height: 14px; border-radius: 6px; margin: 11px 16px;
    background: linear-gradient(90deg, var(--border) 25%, var(--line) 50%, var(--border) 75%);
    background-size: 200% 100%; animation: shimmer 1.1s infinite linear; }
  @keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
  mark { background: var(--mark); color: inherit; padding: 0 1px; border-radius: 2px; }

  /* ---------- 详情页 ---------- */
  .dhead { display: flex; align-items: flex-start; gap: 14px; flex-wrap: wrap; }
  .dhead .ticon { font-size: 38px; }
  .dhead h2 { margin: 0; font-size: 21px; }
  .dhead .sub { color: var(--muted); font-size: 13px; margin-top: 3px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .dhead .dacts { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .back { margin-bottom: 12px; }
  .dgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 16px; }
  @media (max-width: 860px) { .dgrid { grid-template-columns: 1fr; } }
  .panel { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; box-shadow: var(--shadow-sm); }
  .panel h4 { margin: 0 0 8px; font-size: 13.5px; color: var(--muted); font-weight: 600; letter-spacing: .4px; }
  .kv { margin: 3px 0; font-size: 13.2px; }
  .kv b { color: var(--muted); font-weight: 600; margin-right: 6px; }
  .paramrow { display: flex; gap: 8px; align-items: center; margin: 6px 0; flex-wrap: wrap; }
  .paramrow label { font-size: 13px; color: var(--muted); min-width: 72px; }
  .paramrow input {
    flex: 1; min-width: 180px; padding: 7px 10px; font-size: 13px;
    border: 1px solid var(--border); border-radius: 8px; background: var(--bg);
    color: var(--text); outline: none;
  }
  .paramrow input:focus { border-color: var(--accent); }
  #logbox {
    margin: 6px 0 0; background: var(--code-bg); border: 1px solid var(--border);
    border-radius: 9px; padding: 10px 12px; font: 12px/1.55 Consolas, monospace;
    white-space: pre-wrap; word-break: break-all; max-height: 300px; overflow: auto; color: var(--text);
  }
  #logbox:empty::after { content: "暂无日志 —— 从这里启动工具后，运行输出会实时出现在这块"; color: var(--faint); }
  .check { display: flex; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); font-size: 13.2px; }
  .check:last-child { border-bottom: 0; }
  .check .sym { flex: none; width: 20px; text-align: center; }
  .check .fix { color: var(--muted); font-size: 12.3px; margin-top: 1px; }
  .check.fail .t { color: var(--bad); }
  .check.warn .t { color: var(--warn); }
  .envbanner {
    display: flex; gap: 10px; align-items: flex-start; flex-wrap: wrap;
    border: 1px solid var(--warn-border); background: var(--warn-bg); color: var(--warn);
    border-radius: var(--radius); padding: 12px 16px; margin-bottom: 14px; font-size: 13.5px;
  }
  .envbanner .btn { margin-left: auto; }
  /* 嵌入界面 */
  #embedbar { display: flex; gap: 8px; align-items: center; padding: 8px 0; }
  #embedframe { width: 100%; height: calc(100vh - 210px); min-height: 420px; border: 1px solid var(--border); border-radius: var(--radius); background: #fff; }

  /* ---------- 环境自检 / 设置 ---------- */
  .verdict { font-size: 15px; font-weight: 700; margin: 4px 0 12px; }
  .verdict.bad { color: var(--bad); } .verdict.warn { color: var(--warn); } .verdict.ok { color: var(--ok); }
  .setrow { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); flex-wrap: wrap; font-size: 13.8px; }
  .setrow:last-child { border-bottom: 0; }
  .setrow .lab { min-width: 120px; color: var(--muted); font-size: 13px; }
  select, textarea {
    background: var(--card); color: var(--text); border: 1px solid var(--border);
    border-radius: 8px; padding: 6px 10px; font: inherit;
  }
  textarea { width: 100%; min-height: 110px; font: 12px/1.5 Consolas, monospace; }
  .code { background: var(--code-bg); border: 1px solid var(--border); border-radius: 5px; padding: 1px 5px; font-family: Consolas, monospace; font-size: 12px; }

  /* ---------- 命令面板 ---------- */
  #pal { position: fixed; inset: 0; background: rgba(15,23,42,.5); z-index: 55; display: flex; justify-content: center; align-items: flex-start; padding: 9vh 20px 20px; }
  .palbox { background: var(--card); border: 1px solid var(--border); border-radius: 14px; width: 100%; max-width: 660px; box-shadow: var(--shadow-lg); overflow: hidden; animation: pop .14s ease-out; display: flex; flex-direction: column; }
  @keyframes pop { from { transform: scale(.96); opacity: .5; } }
  #pinput { width: 100%; padding: 14px 16px; font-size: 15.5px; border: 0; outline: none; background: var(--card); color: var(--text); border-bottom: 1px solid var(--line); }
  #plist { max-height: 56vh; overflow: auto; }
  .pitem { display: flex; align-items: center; gap: 10px; padding: 10px 16px; cursor: pointer; border-bottom: 1px solid var(--line); }
  .pitem:last-child { border-bottom: 0; }
  .pitem:hover { background: var(--line); }
  .pitem.sel { background: var(--accent-soft); }
  .picon { font-size: 16px; width: 22px; text-align: center; flex: none; }
  .pitem .plabel { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .phint { color: var(--faint); font-size: 12px; flex: none; }
  .psec { padding: 8px 16px 4px; color: var(--faint); font-size: 12px; border-bottom: 1px solid var(--line); }
  .pempty { padding: 22px; text-align: center; color: var(--muted); font-size: 13.5px; }
  .pkbd { display: flex; gap: 14px; padding: 8px 16px; border-top: 1px solid var(--line); color: var(--faint); font-size: 11.5px; }
  .pkbd b { color: var(--muted); }

  #toast {
    position: fixed; left: 50%; bottom: 26px; transform: translate(-50%, 10px);
    background: #111827; color: #f9fafb; padding: 9px 18px; border-radius: 10px;
    font-size: 13.5px; opacity: 0; transition: opacity .22s, transform .22s;
    pointer-events: none; z-index: 60; box-shadow: var(--shadow-lg); max-width: 80vw;
  }
  #toast.show { opacity: .95; transform: translate(-50%, 0); }

  /* ---------- 窄窗口 ---------- */
  @media (max-width: 900px) {
    body { grid-template-columns: 1fr; }
    #side { position: fixed; z-index: 50; width: 250px; transform: translateX(-105%); transition: transform .2s ease; box-shadow: var(--shadow-lg); }
    #side.open { transform: none; }
    #burger { display: inline-block; }
    #netstat { display: none; }
    #view { padding: 14px 12px 40px; }
  }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<nav id="side">
  <div class="brand">🧰 ToolHub<small>本地工具箱 · 桌面版</small></div>
  <div id="navlist"></div>
  <div id="sidefoot">状态加载中…</div>
</nav>
<div id="main">
  <header id="topbar">
    <button id="burger" class="tbtn" title="菜单">☰</button>
    <div class="searchwrap">
      <span class="sicon">🔍</span>
      <input id="q" type="search" placeholder="搜索工具、截图文字、笔记、文件身世、剪贴板…" autocomplete="off" aria-label="全局搜索">
      <button id="qclear" class="hidden" title="清空">×</button>
    </div>
    <button id="palbtn" class="tbtn" title="命令面板（Ctrl+K）">⌘K 命令</button>
    <button id="themebtn" class="tbtn" title="切换主题（自动→亮→暗）">🖥 自动</button>
    <div id="netstat">…</div>
  </header>
  <div id="view"></div>
</div>

<div id="toast"></div>
<div id="pal" class="hidden">
  <div class="palbox">
    <input id="pinput" placeholder="搜索或执行命令…（&gt; 只搜命令 · ↑↓ 选择 · 回车执行 · Esc 关闭）" autocomplete="off">
    <div id="plist"></div>
    <div class="pkbd"><span><b>↑↓</b> 选择</span><span><b>Enter</b> 执行</span><span><b>&gt;</b> 只搜命令</span><span><b>Esc</b> 关闭</span></div>
  </div>
</div>

<script>
"use strict";
/* ================= 基础工具 ================= */
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
  });
}
function fmtWhen(ts) {
  if (!ts) return "";
  var d = new Date(ts * 1000), p = function (n) { return (n < 10 ? "0" : "") + n; };
  return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) + " " + p(d.getHours()) + ":" + p(d.getMinutes());
}
function relTime(ts) {
  if (!ts) return "";
  var diff = Date.now() / 1000 - ts;
  if (diff < 60) return "刚刚";
  if (diff < 3600) return Math.floor(diff / 60) + " 分钟前";
  if (diff < 86400) return Math.floor(diff / 3600) + " 小时前";
  var d = new Date(ts * 1000), p = function (n) { return (n < 10 ? "0" : "") + n; };
  var md = (d.getMonth() + 1) + "-" + p(d.getDate());
  if (d.getFullYear() !== new Date().getFullYear()) md = d.getFullYear() + "-" + md;
  return md + " " + p(d.getHours()) + ":" + p(d.getMinutes());
}
var toastTimer = null;
function toast(msg) {
  var t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.classList.remove("show"); }, 3200);
}
/* 页内确认框：不依赖原生 confirm()（pywebview/WebView2 下原生脚本对话框不可靠）。
   返回 Promise<boolean>，Esc/点遮罩=取消。 */
function uiConfirm(msg) {
  return new Promise(function (resolve) {
    var wrap = document.createElement("div");
    wrap.id = "uiconfirm";
    wrap.style.cssText = "position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:70;display:flex;align-items:center;justify-content:center;padding:24px;";
    wrap.innerHTML = '<div style="background:var(--card);border:1px solid var(--border);border-radius:14px;max-width:430px;width:100%;box-shadow:var(--shadow-lg);padding:18px 20px;font-size:14px;color:var(--text)">' +
      '<div style="white-space:pre-wrap;line-height:1.6">' + esc(msg) + "</div>" +
      '<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px">' +
      '<button class="btn" data-r="0">取消</button>' +
      '<button class="btn danger" data-r="1">确定</button></div></div>';
    document.body.appendChild(wrap);
    var closed = false;
    function done(yes) {
      if (closed) return;
      closed = true;
      wrap.remove();
      document.removeEventListener("keydown", onKey);
      resolve(yes);
    }
    function onKey(e) { if (e.key === "Escape") done(false); }
    Array.prototype.forEach.call(wrap.querySelectorAll("[data-r]"), function (b) {
      b.onclick = function () { done(b.getAttribute("data-r") === "1"); };
    });
    wrap.addEventListener("click", function (e) { if (e.target === wrap) done(false); });
    document.addEventListener("keydown", onKey);
  });
}
function hi(text, q) {
  var safe = esc(text);
  if (!q) return safe;
  var eq = esc(q).replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  return safe.replace(new RegExp(eq, "gi"), function (m) { return "<mark>" + m + "</mark>"; });
}

/* ================= 主题 ================= */
var THEME_KEY = "toolhub-theme";
function getTheme() {
  try { return localStorage.getItem(THEME_KEY) || (SETTINGS && SETTINGS.theme) || "auto"; }
  catch (e) { return "auto"; }
}
function applyTheme() {
  var pref = getTheme();
  var dark = pref === "dark" ||
    (pref === "auto" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.classList.toggle("dark", dark);
  var b = document.getElementById("themebtn");
  if (b) b.textContent = pref === "auto" ? "🖥 自动" : (pref === "dark" ? "🌙 暗色" : "☀️ 亮色");
}
function setTheme(pref) {
  try { localStorage.setItem(THEME_KEY, pref); } catch (e) {}
  postSettings({ theme: pref });
  applyTheme();
}
function cycleTheme() {
  var order = ["auto", "light", "dark"];
  var next = order[(order.indexOf(getTheme()) + 1) % 3];
  setTheme(next);
  toast("主题：" + (next === "auto" ? "跟随系统" : next === "dark" ? "深色" : "浅色"));
}

/* ================= 状态 ================= */
var TOOLS = [], STATUS = {}, SETTINGS = { favorites: [], order: [], first_run_done: false, theme: "auto" };
var CATS = [], WARNINGS = [], APP = {};
var SHELL = new URLSearchParams(location.search).has("shell");
/* 页内输入框：原生 prompt() 在嵌入浏览器里会被静默吞掉（IAB 实测），
   与 uiConfirm 同理自绘。返回 Promise<string|null>（null=取消）。 */
function uiPrompt(msg, def) {
  return new Promise(function (resolve) {
    var wrap = document.createElement("div");
    wrap.id = "uiprompt";
    wrap.style.cssText = "position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:70;display:flex;align-items:center;justify-content:center;padding:24px;";
    wrap.innerHTML = '<div style="background:var(--card);border:1px solid var(--border);border-radius:14px;max-width:540px;width:100%;box-shadow:var(--shadow-lg);padding:18px 20px;font-size:14px;color:var(--text)">' +
      '<div style="margin-bottom:10px;white-space:pre-wrap;line-height:1.6">' + esc(msg) + "</div>" +
      '<input type="text" id="uiprompt-input" style="width:100%;padding:8px 10px;font-size:13.5px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text)" value="' + esc(def || "") + '">' +
      '<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px">' +
      '<button class="btn" data-r="0">取消</button>' +
      '<button class="btn primary" data-r="1">确定</button></div></div>';
    document.body.appendChild(wrap);
    var inp = wrap.querySelector("#uiprompt-input");
    inp.focus();
    inp.select();
    var closed = false;
    function done(val) {
      if (closed) return;
      closed = true;
      wrap.remove();
      document.removeEventListener("keydown", onKey);
      resolve(val);
    }
    function onKey(e) {
      if (e.key === "Escape") done(null);
      else if (e.key === "Enter") done(inp.value.trim() || null);
    }
    wrap.querySelector('[data-r="0"]').onclick = function () { done(null); };
    wrap.querySelector('[data-r="1"]').onclick = function () { done(inp.value.trim() || null); };
    wrap.addEventListener("click", function (e) { if (e.target === wrap) done(null); });
    document.addEventListener("keydown", onKey);
  });
}
function toolById(id) {
  for (var i = 0; i < TOOLS.length; i++) if (TOOLS[i].id === id) return TOOLS[i];
  return null;
}
function isOnline(id) { return !!(STATUS[id] && STATUS[id].online); }
function ordered(list) {
  var rank = {};
  (SETTINGS.order || []).forEach(function (id, i) { rank[id] = i; });
  return list.slice().sort(function (a, b) {
    var ra = rank[a.id] === undefined ? 9999 : rank[a.id];
    var rb = rank[b.id] === undefined ? 9999 : rank[b.id];
    return ra === rb ? (a.id < b.id ? -1 : 1) : ra - rb;
  });
}
function postSettings(patch, cb) {
  fetch("/api/settings", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify(patch) })
    .then(function (r) { return r.json(); })
    .then(function (d) { SETTINGS = d.settings || SETTINGS; if (cb) cb(SETTINGS); })
    .catch(function () { toast("设置保存失败（服务没响应）"); });
}

/* ================= 侧边栏 ================= */
var CAT_EMOJI = { "文件整理": "🗂", "记忆搜索": "🔎", "内容笔记": "✍️", "隐私安全": "🛡", "传输共享": "🌐" };
function renderNav() {
  var cur = location.hash || "#/";
  var favN = (SETTINGS.favorites || []).filter(function (id) { return toolById(id); }).length;
  function nav(hash, em, label, cnt, active) {
    return '<button class="nav' + (active ? " active" : "") + '" data-nav="' + esc(hash) + '">' +
      '<span class="em">' + em + "</span>" + esc(label) +
      (cnt !== "" ? '<span class="cnt">' + cnt + "</span>" : "") + "</button>";
  }
  var html = nav("#/", "🏠", "全部工具", TOOLS.length, cur === "#/" || cur === "#");
  html += nav("#/fav", "⭐", "收藏", favN || "", cur === "#/fav");
  html += '<div class="navsec">分类</div>';
  CATS.forEach(function (c) {
    var n = TOOLS.filter(function (t) { return t.category === c; }).length;
    html += nav("#/cat/" + encodeURIComponent(c), CAT_EMOJI[c] || "📁", c, n,
      cur === "#/cat/" + encodeURIComponent(c));
  });
  html += '<div class="navsec">维护</div>';
  html += nav("#/scenes", "🎬", "工作场景", "", cur === "#/scenes" || cur.indexOf("#/scene-edit") === 0);
  html += nav("#/plugins", "🔌", "我的插件", "", cur === "#/plugins");
  html += nav("#/import", "➕", "导入软件", "", cur.indexOf("#/import") === 0);
  html += nav("#/env", "🩺", "环境自检", "", cur === "#/env");
  html += nav("#/settings", "⚙️", "设置", "", cur === "#/settings");
  var box = document.getElementById("navlist");
  box.innerHTML = html;
  Array.prototype.forEach.call(box.querySelectorAll("[data-nav]"), function (b) {
    b.onclick = function () { location.hash = b.getAttribute("data-nav"); closeSide(); };
  });
}
function closeSide() { document.getElementById("side").classList.remove("open"); }

/* ================= 首页（分类卡片） ================= */
function cardHtml(t) {
  var st = STATUS[t.id] || {}, online = !!st.online;
  var fav = (SETTINGS.favorites || []).indexOf(t.id) >= 0;
  var isPlug = t.kind === "plugin";
  var iconHtml = t.icon_url
    ? '<img class="ticon-img" src="' + esc(t.icon_url) + '" onerror="this.outerHTML=\'<span class=ticon>' + esc(t.icon || "🧩") + "</span>'\">"
    : '<span class="ticon">' + esc(t.icon || "🧰") + "</span>";
  var ms = online && !isPlug ? '<span class="ms" data-ms="' + esc(t.id) + '">' + (st.ms || 0) + "ms</span>" : "";
  var tags = '<span class="tag">' + esc(t.category) + "</span>";
  if (isPlug) {
    tags += '<span class="tag">插件</span>';
    if (t.needs_admin) tags += '<span class="tag warn">🛡 管理员</span>';
    var pstate = st.plugin_state || "ok";
    if (pstate === "invalid") tags += '<span class="tag warn">已失效 · 可重新定位</span>';
  }
  if (t.status === "experimental") tags += '<span class="tag exp">实验性</span>';
  if (t.status === "needs-setup") tags += '<span class="tag warn">需配置</span>';
  if (t.note && !isPlug) tags += '<span class="tag warn">' + esc(t.note) + "</span>";
  var dotCls = "dot" + (online ? " on" : (st.plugin_state === "invalid" ? " bad" : ""));
  var open = !isPlug && online
    ? '<button class="btn open" data-embed="' + esc(t.id) + '">打开</button>'
    : "";
  var launchBtn = "";
  if (isPlug) {
    launchBtn = (st.plugin_state === "invalid")
      ? '<button class="btn primary" data-relocate="' + esc(t.id) + '">重新定位</button>'
      : '<button class="btn primary" data-pluglaunch="' + esc(t.id) + '">启动</button>';
  } else {
    launchBtn = online ? "" : '<button class="btn primary" data-launch="' + esc(t.id) + '">启动</button>';
  }
  var stop = online ? '<button class="btn danger" data-stop="' + esc(t.id) + '">停止</button>' : "";
  return '<div class="card" draggable="true" data-id="' + esc(t.id) + '">' +
    '<button class="star' + (fav ? " on" : "") + '" data-star="' + esc(t.id) + '" title="收藏/取消收藏">' + (fav ? "★" : "☆") + "</button>" +
    '<div class="row">' + iconHtml +
    '<h3><a href="#/tool/' + esc(t.id) + '">' + esc(t.name) + "</a></h3>" +
    '<span class="' + dotCls + '"></span>' + ms + "</div>" +
    "<p>" + esc(t.desc) + "</p>" +
    '<div class="tagrow">' + tags + "</div>" +
    '<div class="acts"><button class="btn" data-detail="' + esc(t.id) + '">详情</button>' + open + launchBtn + stop + "</div>" +
    "</div>";
}
function sectionHtml(title, list) {
  if (!list.length) return "";
  return '<div class="cathead"><h2>' + esc(title) + '</h2><span class="n">' + list.length + " 个</span></div>" +
    '<div class="grid" data-grid="' + esc(title) + '">' + list.map(cardHtml).join("") + "</div>";
}
function renderHome() {
  var v = document.getElementById("view");
  var cur = decodeURIComponent((location.hash.match(/^#\/cat\/(.+)$/) || [])[1] || "");
  var hash = location.hash || "#/";
  var list = TOOLS;
  var title = null;
  if (hash === "#/fav") {
    list = ordered((SETTINGS.favorites || []).map(toolById).filter(Boolean));
    title = "⭐ 收藏";
  } else if (cur) {
    list = TOOLS.filter(function (t) { return t.category === cur; });
    title = (CAT_EMOJI[cur] || "📁") + " " + cur;
  } else {
    list = ordered(TOOLS);
  }
  var html = "";
  if (!list.length) {
    html = '<div class="empty">' + (hash === "#/fav"
      ? "还没有收藏 —— 点工具卡右上角的 ☆ 收藏常用的工具，它们会集中出现在这里"
      : "这个分类下还没有工具") + "</div>";
  } else if (title) {
    html = sectionHtml(title, list);
  } else {
    var groups = {};
    CATS.forEach(function (c) { groups[c] = []; });
    list.forEach(function (t) { (groups[t.category] = groups[t.category] || []).push(t); });
    Object.keys(groups).forEach(function (c) { html += sectionHtml(c, groups[c]); });
    var extra = list.filter(function (t) { return CATS.indexOf(t.category) < 0; });
    if (extra.length) html += sectionHtml("其他", extra);
  }
  if (WARNINGS.length) {
    html = '<div class="envbanner">⚠ 注册表提示：' + WARNINGS.map(function (w) { return esc(w); }).join("；") + "</div>" + html;
  }
  if (APP.loaded && !SETTINGS.first_run_done) {
    html = '<div class="envbanner">👋 第一次用？建议先跑一遍 <b>环境自检</b>，确认这台电脑上哪些工具立即可用、哪些需要一次性配置。' +
      '<button class="btn" id="envfirst">去自检</button></div>' + html;
  }
  v.innerHTML = html;
  bindCards(v);
  enableDrag(v);
  var ef = document.getElementById("envfirst");
  if (ef) ef.onclick = function () { location.hash = "#/env"; };
}

function bindCards(scope) {
  Array.prototype.forEach.call(scope.querySelectorAll("[data-launch]"), function (b) {
    b.onclick = function () { launch(b.getAttribute("data-launch")); };
  });
  Array.prototype.forEach.call(scope.querySelectorAll("[data-pluglaunch]"), function (b) {
    b.onclick = function () { plugLaunch(b.getAttribute("data-pluglaunch")); };
  });
  Array.prototype.forEach.call(scope.querySelectorAll("[data-relocate]"), function (b) {
    b.onclick = function () { relocate(b.getAttribute("data-relocate")); };
  });
  Array.prototype.forEach.call(scope.querySelectorAll("[data-stop]"), function (b) {
    b.onclick = function () { stopTool(b.getAttribute("data-stop")); };
  });
  Array.prototype.forEach.call(scope.querySelectorAll("[data-detail]"), function (b) {
    b.onclick = function () { location.hash = "#/tool/" + b.getAttribute("data-detail"); };
  });
  Array.prototype.forEach.call(scope.querySelectorAll("[data-star]"), function (b) {
    b.onclick = function () { toggleFav(b.getAttribute("data-star")); };
  });
  Array.prototype.forEach.call(scope.querySelectorAll("[data-embed]"), function (b) {
    b.onclick = function () { openEmbed(b.getAttribute("data-embed")); };
  });
}
/* 插件元信息缓存（needs_inputs 来自参数模板声明，启动表单渲染用） */
var PLUG_META = {};
function ensurePlugMeta(cb) {
  if (PLUG_META._loaded) { cb(); return; }
  fetch("/api/plugins").then(function (r) { return r.json(); }).then(function (d) {
    (d.plugins || []).forEach(function (p) { PLUG_META[p.id] = p; });
    PLUG_META._loaded = true;
    cb();
  }).catch(function () { cb(); });
}
/* 页内输入表单：插件带参数模板（{file}/{folder}/{text}/{arg:名}）启动时弹出。
   与 uiPrompt 同理自绘（嵌入浏览器原生对话框不可靠）。返回 Promise<inputs|null>。 */
function uiInputsForm(req, title) {
  return new Promise(function (resolve) {
    var wrap = document.createElement("div");
    wrap.style.cssText = "position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:70;display:flex;align-items:flex-start;justify-content:center;padding:6vh 24px 24px;overflow:auto;";
    var rows = "";
    function row(label, inner, browse) {
      return '<div class="paramrow"><label>' + esc(label) + "</label>" + inner +
        (browse ? '<button class="btn" data-browse="' + browse + '">📁 浏览…</button>' : "") + "</div>";
    }
    if (req.file) rows += row("文件", '<input data-in="file" placeholder="要传给 {file} 的文件完整路径">', "file");
    if (req.folder) rows += row("文件夹", '<input data-in="folder" placeholder="要传给 {folder} 的文件夹完整路径">', "folder");
    if (req.text) rows += row("文本", '<input data-in="text" placeholder="要传给 {text} 的内容">');
    (req.args || []).forEach(function (n) {
      rows += row(n, '<input data-arg="' + esc(n) + '" placeholder="{arg:' + esc(n) + '} 的值">');
    });
    wrap.innerHTML = '<div style="background:var(--card);border:1px solid var(--border);border-radius:14px;max-width:600px;width:100%;box-shadow:var(--shadow-lg);padding:18px 20px;font-size:14px;color:var(--text)">' +
      '<div style="font-weight:600;font-size:15px;margin-bottom:4px">' + esc(title || "给它要用的输入") + "</div>" +
      '<div class="ms" style="margin-bottom:12px">这个插件的参数模板声明了以下输入——填好才会启动。</div>' + rows +
      '<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px">' +
      '<button class="btn" data-r="0">取消</button>' +
      '<button class="btn primary" data-r="1">▶ 启动</button></div></div>';
    document.body.appendChild(wrap);
    var first = wrap.querySelector("input");
    if (first) first.focus();
    var closed = false;
    function done(val) {
      if (closed) return;
      closed = true;
      wrap.remove();
      document.removeEventListener("keydown", onKey);
      resolve(val);
    }
    function collect() {
      var inputs = {};
      Array.prototype.forEach.call(wrap.querySelectorAll("[data-in]"), function (el) {
        var v = el.value.trim();
        if (v) inputs[el.getAttribute("data-in")] = v;
      });
      var args = {};
      Array.prototype.forEach.call(wrap.querySelectorAll("[data-arg]"), function (el) {
        args[el.getAttribute("data-arg")] = el.value.trim();
      });
      if (Object.keys(args).length) inputs.args = args;
      return inputs;
    }
    Array.prototype.forEach.call(wrap.querySelectorAll("[data-browse]"), function (b) {
      b.onclick = function () {
        var bridge = window.pywebview && window.pywebview.api;
        var kind = b.getAttribute("data-browse");
        if (bridge && typeof bridge.pick_file === "function") {
          (kind === "folder" ? bridge.pick_folder() : bridge.pick_file())
            .then(function (p) { if (p) wrap.querySelector('[data-in="' + kind + '"]').value = p; })
            .catch(function () {});
        } else {
          toast("当前窗口模式没有文件选择框——粘贴路径（资源管理器里 Shift+右键 → 复制文件地址）");
        }
      };
    });
    wrap.querySelector('[data-r="0"]').onclick = function () { done(null); };
    wrap.querySelector('[data-r="1"]').onclick = function () {
      var missing = null;
      Array.prototype.forEach.call(wrap.querySelectorAll("[data-arg]"), function (el) {
        if (!missing && !el.value.trim()) missing = el.getAttribute("data-arg");
      });
      if (missing) { toast("参数「" + missing + "」还没填"); return; }
      done(collect());
    };
    wrap.addEventListener("click", function (e) { if (e.target === wrap) done(null); });
    function onKey(e) {
      if (e.key === "Escape") done(null);
      else if (e.key === "Enter" && e.target.tagName !== "TEXTAREA") {
        var m = null;
        Array.prototype.forEach.call(wrap.querySelectorAll("[data-arg]"), function (el) {
          if (!m && !el.value.trim()) m = el.getAttribute("data-arg");
        });
        if (m) { toast("参数「" + m + "」还没填"); return; }
        done(collect());
      }
    }
    document.addEventListener("keydown", onKey);
  });
}
function plugLaunch(id) {
  ensurePlugMeta(function () {
    var meta = PLUG_META[id];
    var req = meta && meta.needs_inputs;
    if (req && (req.file || req.folder || req.text || (req.args || []).length)) {
      uiInputsForm(req, "启动「" + (meta ? meta.name : id) + "」").then(function (inputs) {
        if (!inputs) return;
        doPlugLaunch(id, inputs);
      });
    } else {
      doPlugLaunch(id, null);
    }
  });
}
function doPlugLaunch(id, inputs) {
  fetch("/api/launch", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ id: id, inputs: inputs || undefined }) })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (!d.ok) { toast("启动失败：" + (d.error || "未知错误")); return; }
      toast(d.output_dir ? "已启动——结果会输出到：" + d.output_dir : (d.hint || "已启动"));
      PLUG_META = {};          // 插件可能被编辑过，下次重新拉
      refreshStatus();
      if (location.hash.indexOf("#/plugins") === 0) setTimeout(renderPlugins, 1200);
    })
    .catch(function () { toast("启动请求失败（桌面服务没响应）"); });
}
function plugStop(id) {
  fetch("/api/stop", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ id: id }) })
    .then(function (r) { return r.json(); })
    .then(function (d) {

/* 选路径：有 pywebview 桥就用原生对话框，否则用页内输入框（原生 prompt 在嵌入浏览器不可靠） */
function pickOrPastePath(startDir) {
  return new Promise(function (resolve) {
    var bridge = window.pywebview && window.pywebview.api;
    if (bridge && typeof bridge.pick_file === "function") {
      bridge.pick_file().then(function (p) { resolve(p || ""); })
        .catch(function () { resolve(""); });
      return;
    }
    uiPrompt("把软件的完整路径粘贴到这里\n（在资源管理器里选中文件，按住 Shift 右键 → 复制文件地址）",
             startDir || "")
      .then(function (v) { resolve(v || ""); });
  });
}
function toggleFav(id) {
  var favs = (SETTINGS.favorites || []).slice();
  var i = favs.indexOf(id);
  if (i >= 0) favs.splice(i, 1); else favs.unshift(id);
  postSettings({ favorites: favs }, function () { renderRoute(); renderNav(); });
}
function enableDrag(scope) {
  var cards = scope.querySelectorAll(".card[data-id]");
  var dragged = null;
  Array.prototype.forEach.call(cards, function (c) {
    c.addEventListener("dragstart", function () { dragged = c; c.classList.add("dragging"); });
    c.addEventListener("dragend", function () { c.classList.remove("dragging"); dragged = null; });
    c.addEventListener("dragover", function (e) {
      e.preventDefault();
      if (!dragged || dragged === c) return;
      var r = c.getBoundingClientRect();
      var after = (e.clientY - r.top) > r.height / 2;
      c.parentNode.insertBefore(dragged, after ? c.nextSibling : c);
    });
  });
  scope.addEventListener("drop", function (e) {
    e.preventDefault();
    var ids = [];
    Array.prototype.forEach.call(scope.querySelectorAll(".card[data-id]"), function (c) {
      ids.push(c.getAttribute("data-id"));
    });
    if (ids.length) postSettings({ order: ids });
  });
}

/* ================= 启动 / 停止 ================= */
var launchTimers = {};
function launch(id, params) {
  var t = toolById(id);
  toast("正在启动 " + (t ? t.name : id) + "…");
  fetch("/api/launch", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ id: id, params: params || {} }) })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (!d.ok) { toast("启动失败：" + (d.error || "未知错误")); return; }
      toast(d.already ? "已经在运行了，直接打开即可" : "已拉起，等服务就绪（几秒）…");
      clearInterval(launchTimers[id]);
      var tries = 0;
      launchTimers[id] = setInterval(function () {
        tries++;
        refreshStatus();
        if (isOnline(id) || tries > 20) clearInterval(launchTimers[id]);
        if (isOnline(id) && location.hash === "#/tool/" + id) renderRoute();
      }, 1500);
      refreshStatus();
    })
    .catch(function () { toast("启动请求失败（桌面服务没响应）"); });
}
function stopTool(id) {
  var t = toolById(id);
  if (!t) return;
  uiConfirm("强制结束 " + t.name + "？\n该工具未保存的工作可能丢失。").then(function (yes) {
    if (!yes) return;
    fetch("/api/stop", { method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ id: id }) })
      .then(function (r) { return r.json(); })
      .then(function (d) {
        toast(d.ok ? "已结束（PID " + (d.killed || []).join(", ") + "）" : "停止失败：" + (d.error || "未知"));
        refreshStatus();
        if (location.hash.indexOf("#/tool/") === 0) renderRoute();
      })
      .catch(function () { toast("停止请求失败"); });
  });
}

        .then(function (yes) {

/* 带自定义 HTML 的确认面板（场景预览/结果用）；buttons=false 时不渲染默认确认/取消 */
function uiConfirmPanel(title, htmlBody, opts) {
  opts = opts || {};
  return new Promise(function (resolve) {
    var wrap = document.createElement("div");
    wrap.style.cssText = "position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:70;display:flex;align-items:flex-start;justify-content:center;padding:5vh 24px 24px;overflow:auto;";
    wrap.innerHTML = '<div style="background:var(--card);border:1px solid var(--border);border-radius:14px;max-width:640px;width:100%;box-shadow:var(--shadow-lg);padding:18px 20px;font-size:14px;color:var(--text)">' +
      '<div style="font-weight:600;font-size:15px;margin-bottom:10px">' + title + "</div>" +
      htmlBody +
      (opts.buttons === false ? "" :
        '<div style="display:flex;gap:8px;justify-content:flex-end;margin-top:16px">' +
        '<button class="btn" data-r="0">取消</button>' +
        '<button class="btn primary" data-r="1">确认启动</button></div>') + "</div>";
    document.body.appendChild(wrap);
    var closed = false;
    function done(val) {
      if (closed) return;
      closed = true;
      wrap.remove();
      document.removeEventListener("keydown", onKey);
      resolve(val);
    }
    function onKey(e) { if (e.key === "Escape") done(false); }
    document.addEventListener("keydown", onKey);
    var no = wrap.querySelector('[data-r="0"]');
    var yes = wrap.querySelector('[data-r="1"]');
    if (no) no.onclick = function () { done(false); };
    if (yes) yes.onclick = function () { done(true); };
    var cl = wrap.querySelector("[data-close]");
    if (cl) cl.onclick = function () { done(false); };
    wrap.addEventListener("click", function (e) { if (e.target === wrap) done(false); });
  });
}

/* ---------- 批量扫描导入 / 开始菜单挑选（阶段 B）---------- */
function manifestNeeds(m) {
  var joined = (((m.launch || {}).args || []).join(" ") + " " +
                ((m.output || {}).dir || ""));
  return {
    file: /\{file(_dir|_stem)?\}/.test(joined),
    folder: /\{folder\}/.test(joined),
    text: /\{text\}/.test(joined),
    args: (joined.match(/\{arg:([^}]+)\}/g) || []).map(function (s) { return s.slice(5, -1); })
  };
}
var SCAN = { dir: "", items: null, done: null };
function renderScan() {
  var v = document.getElementById("view");
  var head = '<div class="cathead"><h2>🗂 批量扫描导入</h2><span class="n">绿色软件目录一次全收</span></div>' +
    '<button class="btn back" id="scanback">← 返回导入向导</button>';
  if (!SCAN.items) {
    v.innerHTML = head +
      '<div class="wcard"><h3>扫描哪个目录？</h3>' +
      '<div class="hint2">适合「绿色软件大本营」：一堆免安装小工具所在的文件夹。会列出里面的 exe / 快捷方式（含一层子目录），卸载器、安装器自动过滤。</div>' +
      '<div class="wrow"><label>目录路径</label><input type="text" id="scandir" placeholder="例如 D:\\Tools" value="' + esc(SCAN.dir) + '">' +
      '<button class="btn" id="scanbrowse">📁 浏览…</button>' +
      '<button class="btn primary" id="scango">扫描 →</button></div>' +
      '<div class="ms">导入只是登记路标，不会移动任何文件。</div></div>';
    document.getElementById("scanback").onclick = function () { location.hash = "#/import"; };
    document.getElementById("scango").onclick = scanGo;
    document.getElementById("scandir").addEventListener("keydown", function (e) {
      if (e.key === "Enter") scanGo();
    });
    document.getElementById("scanbrowse").onclick = function () {
      var bridge = window.pywebview && window.pywebview.api;
      if (bridge && typeof bridge.pick_folder === "function") {
        bridge.pick_folder().then(function (p) {
          if (p) { document.getElementById("scandir").value = p; scanGo(); }
        }).catch(function () {});
      } else toast("当前窗口模式没有目录选择框——粘贴目录路径");
    };
    return;
  }
  if (SCAN.done) { scanRenderDone(v, head); return; }
  var items = SCAN.items;
  v.innerHTML = head +
    '<div class="wcard"><h3>' + esc(SCAN.dir) + "</h3>" +
    '<div class="hint2">扫到 ' + items.length + " 个可导入项。勾选要收进工具箱的（已过滤项默认不勾）：</div>" +
    '<div class="wfoot" style="margin-top:0"><button class="btn" id="scanall">全选/全不选</button>' +
    '<button class="btn primary" id="scanimport">导入勾选的 <b id="scann">0</b> 个</button>' +
    '<span class="ms">进度和结果会显示在下面</span></div>' +
    '<div style="max-height:52vh;overflow:auto;margin-top:10px">' +
    items.map(function (i, idx) {
      var sz = i.size > 1048576 ? (i.size / 1048576).toFixed(1) + " MB" : Math.max(1, Math.round(i.size / 1024)) + " KB";
      return '<div class="checkline"' + (i.blocked ? ' style="opacity:.5"' : "") + ">" +
        '<input type="checkbox" data-idx="' + idx + '"' + (i.blocked ? "" : " checked") + '>' +
        "<div>" + esc(i.name) + ' <span class="ms">' + sz + "</span>" +
        (i.blocked ? '<span class="tag warn" style="margin-left:6px">已过滤（卸载器/安装器类）</span>' : "") +
        '<div class="ms" style="font-size:11.5px">' + esc(i.path) + "</div></div></div>";
    }).join("") + "</div></div>";
  document.getElementById("scanback").onclick = function () { location.hash = "#/import"; };
  function recount() {
    var n = 0;
    Array.prototype.forEach.call(v.querySelectorAll("[data-idx]"), function (c) {
      if (c.checked) n++;
    });
    document.getElementById("scann").textContent = n;
  }
  Array.prototype.forEach.call(v.querySelectorAll("[data-idx]"), function (c) {
    c.addEventListener("change", recount);
  });
  recount();
  document.getElementById("scanall").onclick = function () {
    var anyOff = Array.prototype.some.call(v.querySelectorAll("[data-idx]"), function (c) { return !c.checked; });
    Array.prototype.forEach.call(v.querySelectorAll("[data-idx]"), function (c) {
      if (!SCAN.items[+c.getAttribute("data-idx")].blocked) c.checked = anyOff;
    });
    recount();
  };
  document.getElementById("scanimport").onclick = scanImport;
}
function scanGo() {
  SCAN.dir = (document.getElementById("scandir").value || "").trim();
  if (!SCAN.dir) { toast("先填目录路径"); return; }
  toast("扫描中…");
  fetch("/api/plugins/scan", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ path: SCAN.dir }) })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (!d.ok) { toast(d.error || "扫描失败"); return; }
      SCAN.items = d.items || [];
      SCAN.done = null;
      renderScan();
    }).catch(function () { toast("扫描请求失败"); });
}
function scanImport() {
  var picked = [];
  Array.prototype.forEach.call(document.querySelectorAll("[data-idx]"), function (c) {
    if (c.checked) picked.push(SCAN.items[+c.getAttribute("data-idx")]);
  });
  if (!picked.length) { toast("先勾选至少一个"); return; }
  SCAN.done = { importing: picked.slice(), results: [] };
  renderScan();
  scanImportNext(0);
}
function scanImportNext(i) {
  var st = SCAN.done;
  if (i >= st.importing.length) { st.importing = []; renderScan(); return; }
  var item = st.importing[i];
  var box = document.getElementById("scanprogress");
  if (box) box.textContent = "正在导入 " + (i + 1) + "/" + st.importing.length + "：" + item.name;
  fetch("/api/plugins/probe", { method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ path: item.path }) })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      var entry = { name: item.name, id: null, error: null };
      if (d.ok) {
        var m = d.manifest;
        m.source = "scan";
        return fetch("/api/plugins/commit", { method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ manifest: m, confirmed_launch: true,
                                 icon_tmp: d.icon_tmp || "", allow_duplicate: true }) })
          .then(function (r2) { return r2.json(); })
          .then(function (d2) {
            if (d2.ok) entry.id = d2.id;
            else entry.error = d2.duplicate ? "重复，已跳过" : (d2.error || "保存失败");
            st.results.push(entry);
            scanImportNext(i + 1);
          });
      }
      entry.error = d.duplicate ? "重复，已跳过" : (d.error || "识别失败");
      st.results.push(entry);
      scanImportNext(i + 1);
    })
    .catch(function () {
      st.results.push({ name: item.name, id: null, error: "请求失败" });
      scanImportNext(i + 1);
    });
}
function scanRenderDone(v, head) {
  var st = SCAN.done;
  if (st.importing.length) {
    v.innerHTML = head + '<div class="wcard"><h3>批量导入中…</h3><div class="ms" id="scanprogress"></div>' +
      st.results.map(function (r) {
        return '<div class="kv">' + esc(r.name) + " — " + (r.id ? "✓" : esc(r.error || "失败")) + "</div>";
      }).join("") + "</div>";
    return;
  }
  var okN = st.results.filter(function (r) { return r.id; }).length;
  v.innerHTML = head +
    '<div class="wcard"><h3>✅ 导入完成：' + okN + " 个进入工具箱</h3>" +
    '<div class="hint2">顺手补一句话说明（不填也行——之后在「我的插件」里随时可以编辑）：</div>' +
    st.results.map(function (r) {
      return r.id
        ? '<div class="paramrow"><label style="max-width:220px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="' + esc(r.name) + '">' + esc(r.name) + "</label>" +
          '<input data-desc-id="' + esc(r.id) + '" placeholder="一句话说明它是干嘛的"></div>'
        : '<div class="kv" style="opacity:.6">' + esc(r.name) + " — " + esc(r.error || "跳过") + "</div>";
    }).join("") +
    '<div class="wfoot"><button class="btn" id="scanskip">跳过，去工具箱看看</button>' +
    '<button class="btn primary" id="scansave">保存说明</button></div></div>';
  document.getElementById("scanback").onclick = function () { location.hash = "#/import"; };
  document.getElementById("scanskip").onclick = function () {
    SCAN.items = null; SCAN.done = null;
    location.hash = "#/plugins"; refreshStatus();
  };
  document.getElementById("scansave").onclick = function () {
    var rows = Array.prototype.map.call(v.querySelectorAll("[data-desc-id]"), function (el) {
      return { id: el.getAttribute("data-desc-id"), desc: el.value.trim() };
    }).filter(function (x) { return x.desc; });
    var saveNext = function (i) {
      if (i >= rows.length) {
        toast("说明已保存"); SCAN.items = null; SCAN.done = null;
        location.hash = "#/plugins"; refreshStatus(); PLUG_META = {};
        return;
      }
      fetch("/api/plugins/p/" + encodeURIComponent(rows[i].id) + "/edit", { method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ desc: rows[i].desc }) })
        .then(function () { saveNext(i + 1); })
        .catch(function () { saveNext(i + 1); });
    };
    saveNext(0);
  };
}

/* ---------- 开始菜单挑选（阶段 B）---------- */
var SM = { items: null, q: "" };
function renderStartmenu() {
  var v = document.getElementById("view");

    fetch("/api/plugins/startmenu").then(function (r) { return r.json(); }).then(function (d) {

    }).catch(function () {
      SM.items = [];
      renderStartmenu();

    '<div class="wrow"><label>过滤</label><input type="text" id="smq" placeholder="输入名字快速过滤（如：微信、Steam）" value="' + esc(SM.q) + '"></div>' +

/* ---------- 清单分享（阶段 C 一期）---------- */
function exportShare(ids) {
  fetch("/api/plugins/export", { method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ ids: ids }) })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      if (!d.ok) { toast(d.error || "导出失败"); return; }
      var blob = new Blob([d.text], { type: "application/json" });
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "toolhub-plugins.json";
      a.click();
      URL.revokeObjectURL(a.href);
      toast("已导出 " + ids.length + " 个插件的清单——发给朋友，对方在「导入分享文件」里打开即可（不含任何运行记录）");
    }).catch(function () { toast("导出请求失败"); });
}
function uiShareImport() {
  return new Promise(function (resolve) {
    var wrap = document.createElement("div");
    wrap.style.cssText = "position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:70;display:flex;align-items:flex-start;justify-content:center;padding:5vh 24px 24px;overflow:auto;";
    var stage1 = '<div style="margin-bottom:8px;font-weight:600;font-size:15px">📥 导入分享文件</div>' +
      '<div class="ms" style="margin-bottom:10px">把别人导出的 toolhub-plugins.json 内容粘到下面，或直接选这个文件。导入前会先预检：看到每一条是什么、有没有冲突，确认了才落盘。</div>' +
      '<textarea id="sharetext" style="width:100%;min-height:180px" placeholder=\'{"format": "toolhub-plugin-share", ...}\'></textarea>' +
      '<div style="display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap">' +
      '<label class="btn" style="cursor:pointer">📂 选择分享文件<input type="file" id="sharefile" accept=".json,application/json" style="display:none"></label>' +
      '<span class="spacer" style="flex:1"></span>' +
      '<button class="btn" data-r="0">取消</button>' +
      '<button class="btn primary" data-next="1">预检 →</button></div>';
    wrap.innerHTML = '<div style="background:var(--card);border:1px solid var(--border);border-radius:14px;max-width:720px;width:100%;box-shadow:var(--shadow-lg);padding:18px 20px;font-size:14px;color:var(--text)">' + stage1 + "</div>";
    document.body.appendChild(wrap);
    var closed = false;
    function done(val) {
      if (closed) return;
      closed = true;
      wrap.remove();
      document.removeEventListener("keydown", onKey);
      resolve(val);
    }
    function onKey(e) { if (e.key === "Escape") done(null); }
    document.addEventListener("keydown", onKey);
    wrap.querySelector('[data-r="0"]').onclick = function () { done(null); };
    var fileInput = wrap.querySelector("#sharefile");
    fileInput.addEventListener("change", function () {
      var f = fileInput.files && fileInput.files[0];
      if (!f) return;
      var rd = new FileReader();
      rd.onload = function () { wrap.querySelector("#sharetext").value = String(rd.result || ""); };
      rd.readAsText(f, "utf-8");
    });
    wrap.querySelector('[data-next="1"]').onclick = function () {
      var text = wrap.querySelector("#sharetext").value.trim();

function renderSharePreview(wrap, items, done) {

/* ================= 状态轮询 ================= */
var lastSig = null;
var failStreak = 0;   // 连续失败次数：≥2 判定服务断开，插醒目横幅
function ensureDownBanner(show) {
  var old = document.getElementById("downbanner");
  if (show && !old) {
    var b = document.createElement("div");
    b.id = "downbanner";
    b.className = "envbanner";
    b.style.cssText = "border-color:var(--bad-border);background:var(--bad-bg);color:var(--bad);position:sticky;top:0;z-index:40";
    b.innerHTML = "✗ <b>桌面服务断开了</b>——页面上的按钮暂时都点不动。最常见原因：工具箱窗口被关闭。" +
      "怎么办：重新双击桌面上的 ToolHub 图标；服务恢复后本提示会自动消失。" +
      ' <button class="btn" id="downretry" style="margin-left:auto">重试连接</button>';
    var view = document.getElementById("view");
    view.parentNode.insertBefore(b, view);
    document.getElementById("downretry").onclick = function () { refreshStatus(); };
  } else if (!show && old) {
    old.remove();
  }
}
function statusSig() {
  return TOOLS.map(function (t) {
    var s = STATUS[t.id] || {};
    return t.id + ":" + (s.online ? 1 : 0) + ":" + (s.note || "") + ":" +
      (s.plugin_state || "") + ":" + (s.running ? 1 : 0);
  }).join("|");
}
function refreshStatus() {
  fetch("/api/status").then(function (r) { return r.json(); }).then(function (d) {
    failStreak = 0;
    ensureDownBanner(false);
    var n = 0;
    (d.status || []).forEach(function (s) {
      STATUS[s.id] = s;
      // 顶栏计数=真的在运行：内置工具看在线，插件看 running（"可用"不算运行中）
      if (s.plugin_state) { if (s.running) n++; }
      else if (s.online) n++;
    });
    document.getElementById("netstat").innerHTML = "<b>" + n + "</b> / " + TOOLS.length + " 运行中";
    document.getElementById("sidefoot").innerHTML = "<b>" + n + "</b> / " + TOOLS.length + " 运行中 · 数据全部在本机";
    var sig = statusSig();
    if (sig !== lastSig) { lastSig = sig; renderRoute(); }
    else {
      (d.status || []).forEach(function (s) {
        var el = document.querySelector('[data-ms="' + s.id + '"]');
        if (el) el.textContent = s.online ? (s.ms || 0) + "ms" : "";
      });
    }
  }).catch(function () {
    failStreak++;
    if (failStreak >= 2) ensureDownBanner(true);
    document.getElementById("netstat").textContent = "桌面服务没响应";
  });
}

/* ================= 联邦搜索 ================= */
var searchSeq = 0;
function itemHtml(it, q) {
  var thumb = it.url ? '<img class="rthumb" loading="lazy" src="' + esc(it.url) + '" onerror="this.style.display=\'none\'">' : "";
  var extra = [];
  if (it.extra) extra.push(esc(it.extra));
  if (it.when) extra.push(esc(relTime(it.when)));
  var act = it.detail_url ? "detail" : (it.image_url ? "image" : (it.open_url ? "tool" : null));
  var cls = act ? ' link" data-act="' + act + '" data-href="' + esc(it.detail_url || it.image_url || it.open_url) + '" data-title="' + esc(it.title) : "";
  return '<div class="ritem' + cls + '">' + thumb +
    '<div class="rmain"><div class="rtitle">' + hi(it.title, q) + "</div>" +
    (it.snippet ? '<div class="rsnip">' + hi(it.snippet, q) + "</div>" : "") +
    (extra.length ? '<div class="rmeta">' + extra.join("<span>·</span>") + "</div>" : "") +
    "</div></div>";
}
function mdRender(src) {
  function inline(s) {
    return s.replace(/`([^`]+)`/g, function (_, c) { return "<code>" + c + "</code>"; })
            .replace(/\*\*([^*]+)\*\*/g, function (_, c) { return "<strong>" + c + "</strong>"; });
  }
  var out = [], inUl = false;
  esc(src).split(/\r?\n/).forEach(function (ln) {
    var h = ln.match(/^(#{1,4})\s+(.*)$/);
    if (h) {
      if (inUl) { out.push("</ul>"); inUl = false; }
      out.push("<h" + (h[1].length + 1) + ">" + inline(h[2]) + "</h" + (h[1].length + 1) + ">");
    } else if (/^\s*[-*]\s+/.test(ln)) {
      if (!inUl) { out.push("<ul>"); inUl = true; }
      out.push("<li>" + inline(ln.replace(/^\s*[-*]\s+/, "")) + "</li>");
    } else {
      if (inUl) { out.push("</ul>"); inUl = false; }
      if (ln.trim()) out.push("<p>" + inline(ln) + "</p>");
    }
  });
  if (inUl) out.push("</ul>");
  return out.join("");
}
function bindResults(scope, closeAfter) {
  Array.prototype.forEach.call(scope.querySelectorAll("[data-act]"), function (el) {
    el.onclick = function () {
      var act = el.getAttribute("data-act");
      var href = el.getAttribute("data-href");
      if (closeAfter) palClose();
      if (act === "image") {
        var v = document.getElementById("view");
        v.innerHTML = '<button class="btn back" onclick="history.back()">← 返回</button>' +
          '<img class="rthumb" style="width:auto;height:auto;max-width:100%;max-height:72vh;display:block;margin:10px auto" src="' + esc(href) + '" alt="">';
        window.scrollTo(0, 0);
      } else if (act === "tool") {
        if (SHELL) window.location.href = href;  // 壳内导航
        else window.open(href, "_blank");
      } else {
        fetch(href).then(function (r) { return r.json(); }).then(function (d) {
          var title = d.title || d.name || "详情";
          var body = d.content != null ? mdRender(d.content) : esc(d.snippet || d.ocr_text || JSON.stringify(d, null, 2));
          var v = document.getElementById("view");
          v.innerHTML = '<button class="btn back" onclick="history.back()">← 返回</button>' +
            '<div class="panel"><h4>' + esc(title) + "</h4><div>" + body + "</div></div>";
          window.scrollTo(0, 0);
        }).catch(function () { toast("详情加载失败（工具可能已离线）"); });
      }
    };
  });
}
function doSearch(q) {
  var seq = ++searchSeq;
  var v = document.getElementById("view");
  var needle = q.toLowerCase();
  var nameHits = TOOLS.filter(function (t) {
    var hay = t.name + " " + t.desc + " " + t.category +
      ((t.kind === "plugin" && t.aliases) ? " " + t.aliases.join(" ") : "");
    return hay.toLowerCase().indexOf(needle) >= 0;
  });
  var html = "";
  if (nameHits.length) {
    html += '<div class="qtools">' + nameHits.slice(0, 8).map(function (t) {
      return '<button class="btn" data-goto="' + esc(t.id) + '">' + esc(t.icon + " " + t.name) + "</button>";
    }).join("") + "</div>";
  }
  html += '<div id="results"><div class="rgroup"><div class="ghead"><b>跨工具搜索中…</b></div>' +
    '<div class="skel"></div><div class="skel"></div></div></div>';
  v.innerHTML = html;
  Array.prototype.forEach.call(v.querySelectorAll("[data-goto]"), function (b) {
    b.onclick = function () { location.hash = "#/tool/" + b.getAttribute("data-goto"); };
  });
  fetch("/api/federated?q=" + encodeURIComponent(q)).then(function (r) { return r.json(); }).then(function (d) {
    if (seq !== searchSeq) return;
    var q2 = d.q || q;
    var box = document.getElementById("results");
    var html2 = (d.groups || []).map(function (g) {
      var head;
      if (g.ok === true) head = "<b>" + esc(g.name) + '</b><span class="cnt">命中 ' + g.count + " 条</span>";
      else if (g.ok === false) head = "<b>" + esc(g.name) + '</span><span class="err">' + esc(g.error || "不可用") + "</span>";
      else head = "<b>" + esc(g.name) + "</b>";
      var t = toolById(g.id);
      var link = t ? ' <a href="#/tool/' + esc(t.id) + '">打开工具 ↗</a>' : "";
      var items = g.ok === true && g.items.length
        ? g.items.map(function (it) { return itemHtml(it, q2); }).join("")
        : (g.ok === true ? '<div class="empty">该工具没有命中</div>' : "");
      return '<div class="rgroup"><div class="ghead">' + head + link + "</div>" + items + "</div>";
    }).join("");
    box.innerHTML = html2 || '<div class="empty">没有结果</div>';
    bindResults(box);
  }).catch(function () {
    if (seq !== searchSeq) return;
    var box = document.getElementById("results");
    if (box) box.innerHTML = '<div class="empty">搜索请求失败</div>';
  });
}

    return '<div class="pitem' + (i === 0 ? " sel" : "") + '" data-i="' + i + '">' +
      '<span class="picon">' + esc(a.icon) + '</span><span class="plabel">' + hi(a.label, f.q) +
      '</span><span class="phint">' + esc(a.hint) + "</span></div>";
  }).join("");
  if (!f.actionsOnly && f.q) html += '<div class="psec">跨工具搜索…</div><div id="presults"></div>';
  var list = document.getElementById("plist");
  list.innerHTML = html || '<div class="pempty">没有匹配的命令</div>';
  palSel = palItems.length ? 0 : -1;
  Array.prototype.forEach.call(list.querySelectorAll(".pitem"), function (el) {
    el.onclick = function () { palRun(parseInt(el.getAttribute("data-i"), 10)); };
  });
  if (!f.actionsOnly && f.q) palFetchResults(f.q);
}
function palFetchResults(q) {
  var seq = ++palSeq;
  setTimeout(function () {
    if (seq !== palSeq) return;
    fetch("/api/federated?q=" + encodeURIComponent(q)).then(function (r) { return r.json(); }).then(function (d) {
      if (seq !== palSeq) return;
      var box = document.getElementById("presults");
      if (!box) return;
      var any = false;
      var html = (d.groups || []).map(function (g) {
        if (g.ok !== true || !g.items.length) return "";
        any = true;
        return '<div class="psec">' + esc(g.name) + " · 命中 " + g.count + " 条</div>" +
          g.items.slice(0, 3).map(function (it) { return itemHtml(it, q); }).join("");
      }).join("");
      box.innerHTML = any ? html : '<div class="pempty">工具里也没有命中</div>';
      bindResults(box, true);
    }).catch(function () {});
  }, 250);
}
function palRun(i) {
  var item = palItems[i];
  if (!item) return;
  palClose();
  item.a.run();
}
function palMove(delta) {
  var els = document.querySelectorAll("#plist .pitem");
  if (!els.length) return;
  els[palSel] && els[palSel].classList.remove("sel");
  palSel = (palSel + delta + els.length) % els.length;
  els[palSel].classList.add("sel");
  els[palSel].scrollIntoView({ block: "nearest" });
}
function palOpen() {
  document.getElementById("pal").classList.remove("hidden");
  var p = document.getElementById("pinput");
  p.value = "";
  palRender("");
  p.focus();
}
function palClose() {
  document.getElementById("pal").classList.add("hidden");
  palSeq++;
}

/* ================= 事件绑定与启动 ================= */
var qi = document.getElementById("q");
var qclear = document.getElementById("qclear");
var searchTimer = null;
qi.addEventListener("search", function () { var v = qi.value.trim(); if (v) doSearch(v); });
qi.addEventListener("keydown", function (e) { if (e.key === "Enter") { var v = qi.value.trim(); if (v) doSearch(v); } });
qi.addEventListener("input", function () {
  var v = qi.value.trim();
  qclear.classList.toggle("hidden", !qi.value);
  clearTimeout(searchTimer);
  if (!v) { searchSeq++; renderRoute(); return; }
  searchTimer = setTimeout(function () { doSearch(v); }, 300);
});
qclear.onclick = function () { qi.value = ""; qi.dispatchEvent(new Event("input")); qi.focus(); };

var pinput = document.getElementById("pinput");
pinput.addEventListener("input", function () { palRender(pinput.value); });
pinput.addEventListener("keydown", function (e) {
  if (e.key === "ArrowDown") { e.preventDefault(); palMove(1); }
  else if (e.key === "ArrowUp") { e.preventDefault(); palMove(-1); }
  else if (e.key === "Enter") { e.preventDefault(); palRun(palSel); }
});
document.getElementById("pal").addEventListener("click", function (e) {
  if (e.target === this) palClose();
});
document.getElementById("palbtn").onclick = palOpen;
document.getElementById("themebtn").onclick = cycleTheme;
document.getElementById("burger").onclick = function () {
  document.getElementById("side").classList.toggle("open");
};
document.addEventListener("keydown", function (e) {
  if ((e.ctrlKey || e.metaKey) && String(e.key).toLowerCase() === "k") {
    e.preventDefault();
    var pal = document.getElementById("pal");
    if (pal.classList.contains("hidden")) palOpen(); else palClose();
    return;
  }
  var palOpenNow = !document.getElementById("pal").classList.contains("hidden");
  if (e.key === "Escape") {
    if (palOpenNow) palClose();
    else if (qi.value) { qi.value = ""; qi.dispatchEvent(new Event("input")); }
    else if (location.hash.indexOf("#/tool/") === 0) location.hash = "#/";
  } else if (!palOpenNow && e.key === "/") {
    var tag = document.activeElement ? document.activeElement.tagName : "";
    if (!/^(INPUT|TEXTAREA)$/.test(tag)) { e.preventDefault(); qi.focus(); qi.select(); }
  }
});

fetch("/api/tools").then(function (r) { return r.json(); }).then(function (d) {
  TOOLS = d.tools || [];
  CATS = d.categories || [];
  WARNINGS = d.warnings || [];
  APP = d.app || {};
  APP.loaded = true;
  return fetch("/api/settings").then(function (r) { return r.json(); });
}).then(function (d) {
  if (d && d.settings) SETTINGS = d.settings;
  applyTheme();
  renderRoute();
  refreshStatus();
}).catch(function () {
  document.getElementById("view").innerHTML =
    '<div class="envbanner" style="border-color:var(--bad-border);background:var(--bad-bg);color:var(--bad)">' +
    "✗ 桌面服务连不上（正常情况不会出现）。<b>怎么办：</b>关掉窗口重新打开应用；" +
    "还是不行就看故障排查手册第 1 条。</div>";
});
setInterval(refreshStatus, 5000);
</script>
</body>
</html>
